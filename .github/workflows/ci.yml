name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test --ci

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Hugging Face дээр build унахаас өмнө энд барина (AGENTS.md → Deploy ба APK)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t signo-api server
      - name: Health check
        run: |
          docker run -d -p 7860:7860 --name api signo-api
          for i in $(seq 1 30); do curl -sf localhost:7860/api/v1/health && exit 0; sleep 2; done
          docker logs api; exit 1
