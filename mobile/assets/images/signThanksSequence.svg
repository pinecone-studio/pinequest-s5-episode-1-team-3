  <title id="title">Баярлалаа — дохионы дарааллын ноорог</title>
  <desc id="description">mnsl.mn-ийн 0137 бичлэгийн 0.80, 1.10, 1.40 секундийн хоёр гарын байрлалыг хялбаршуулсан зураг. Урд талаас харуулсан. Сум зөвхөн панелын дарааллыг заана. Хуруу, алганы чиглэл, хүрэлцэх байрлал болон нүүрний хувирлыг дохионы хэл мэддэг хүнээр баталгаажуулна. Бичлэгийг орлох заавар биш.</desc>
